name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repository, never writes.
permissions:
  contents: read

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Test, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` cannot be used: the committed package-lock.json is out of sync
      # with npm 11's resolution of optional platform deps (e.g. @emnapi/*), so
      # a clean `npm ci` fails. `--no-package-lock` installs from package.json
      # without reading or rewriting the lockfile, so nothing is modified.
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
