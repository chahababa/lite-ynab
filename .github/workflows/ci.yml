name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: this workflow only reads the repository, never writes.
permissions:
  contents: read

# Cancel superseded runs for the same ref to save runner time.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Test, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        # `@testing-library/dom` is an undeclared peer in the legacy lockfile;
        # install it explicitly because `--legacy-peer-deps` intentionally skips peers.
        run: npm install @testing-library/dom --legacy-peer-deps --no-audit --no-fund --no-package-lock --no-save

      - name: Verify package files unchanged
        run: git diff --exit-code -- package.json package-lock.json

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
