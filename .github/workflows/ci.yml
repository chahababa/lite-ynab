name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Test, typecheck & build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # The package manifest has optional peer dependency ranges that make npm's
      # default resolver crash in Arborist. This only changes resolution; it
      # neither writes the lockfile nor grants workflow write permissions.
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund --no-package-lock

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
